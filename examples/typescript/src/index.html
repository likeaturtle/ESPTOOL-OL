<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="page.title">固件串口烧录工具</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.19.0/css/xterm.css" />
        <link rel="icon" href="./favicon.svg" />
        <script src="https://cdn.jsdelivr.net/npm/xterm@4.19.0/lib/xterm.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
        <style>
            :root {
                --bg-body: #f8fafc;
                --bg-card: #ffffff;
                --text-main: #0f172a;
                --text-muted: #64748b;
                --border-color: #e2e8f0;
                --primary: #0f172a;
                --primary-hover: #1e293b;
                --accent: #2563eb;
                --accent-hover: #1d4ed8;
                --accent-ring: rgba(37, 99, 235, 0.2);
                --success: #10b981;
                --danger: #ef4444;
                --danger-hover: #dc2626;
                --warning: #f59e0b;
                --radius-lg: 12px;
                --radius-md: 8px;
                --radius-sm: 6px;
                --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                --font-mono: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: var(--font-sans);
                background-color: var(--bg-body);
                color: var(--text-main);
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
                -webkit-font-smoothing: antialiased;
            }

            /* Header */
            header {
                background-color: var(--bg-card);
                border-bottom: 1px solid var(--border-color);
                padding: 14px 32px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
                z-index: 10;
                box-shadow: var(--shadow-sm);
            }
            h1.brand {
                font-size: 18px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 10px;
                color: var(--primary);
                letter-spacing: -0.02em;
            }
            .brand img { vertical-align: middle; }
            .badge {
                background-color: #eff6ff;
                color: var(--accent);
                padding: 4px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
                border: 1px solid #bfdbfe;
            }
            .header-right {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            /* Language dropdown */
            .lang-dropdown { position: relative; }
            .lang-btn {
                background: none;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm);
                padding: 6px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
                height: 34px;
                width: 34px;
            }
            .lang-btn:hover { background-color: var(--bg-body); border-color: #cbd5e1; }
            .lang-menu {
                display: none;
                position: absolute;
                top: calc(100% + 4px);
                right: 0;
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow-md);
                min-width: 120px;
                z-index: 100;
                overflow: hidden;
            }
            .lang-menu.open { display: block; }
            .lang-option {
                padding: 8px 14px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.15s;
                color: var(--text-main);
            }
            .lang-option:hover { background-color: var(--bg-body); }
            .lang-option.active { color: var(--accent); font-weight: 600; background-color: #eff6ff; }

            /* Main layout */
            main {
                display: flex;
                flex: 1;
                gap: 24px;
                padding: 24px 32px;
                max-width: 1800px;
                margin: 0 auto;
                width: 100%;
                overflow: hidden;
            }

            /* Left column */
            .left-col {
                width: 440px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                flex-shrink: 0;
                overflow-y: auto;
                padding-right: 8px;
            }
            .left-col::-webkit-scrollbar { width: 4px; }
            .left-col::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

            /* Panel card */
            .panel {
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-sm);
                padding: 24px;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            h2.panel-title {
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--border-color);
                color: var(--primary);
            }
            h2.panel-title svg { flex-shrink: 0; }

            /* Alert */
            .alert-danger {
                background-color: #fef2f2;
                border: 1px solid #fecaca;
                color: var(--danger);
                padding: 12px 16px;
                border-radius: var(--radius-md);
                font-size: 13px;
                box-shadow: var(--shadow-sm);
                position: relative;
            }
            .alert-danger .close-btn {
                position: absolute;
                top: 8px;
                right: 10px;
                background: none;
                border: none;
                color: var(--danger);
                cursor: pointer;
                font-size: 16px;
                line-height: 1;
                opacity: 0.6;
                padding: 0;
                height: auto;
            }
            .alert-danger .close-btn:hover { opacity: 1; }

            /* Safari error */
            .safari-alert {
                background-color: #fef2f2;
                border: 1px solid #fecaca;
                color: var(--danger);
                padding: 16px 20px;
                border-radius: var(--radius-md);
                font-size: 14px;
                text-align: center;
                margin: 24px 32px;
            }

            /* Input group */
            .input-group { display: flex; flex-direction: column; gap: 8px; }
            .input-group label { font-size: 13px; font-weight: 600; color: var(--primary); }
            .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
            .grid-3-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

            select, input[type="text"], input[type="number"] {
                border: 1px solid var(--border-color);
                padding: 8px 12px;
                border-radius: var(--radius-sm);
                background: #fff;
                font-size: 14px;
                color: var(--text-main);
                transition: all 0.2s ease;
                height: 40px;
                width: 100%;
                font-family: var(--font-sans);
            }
            input[type="text"] { font-family: var(--font-mono); }
            select:focus, input[type="text"]:focus, input[type="number"]:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-ring);
            }

            input[type="file"] {
                border: 1px solid var(--border-color);
                padding: 6px 12px;
                border-radius: var(--radius-sm);
                background: #fff;
                font-size: 13px;
                color: var(--text-main);
                transition: all 0.2s ease;
                height: 40px;
                width: 100%;
                cursor: pointer;
            }
            input[type="file"]::file-selector-button {
                background-color: var(--bg-body);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                padding: 4px 10px;
                margin-right: 12px;
                color: var(--text-main);
                cursor: pointer;
                transition: all 0.2s;
                font-size: 12px;
                font-weight: 500;
            }
            input[type="file"]::file-selector-button:hover { background-color: #e2e8f0; }

            /* Checkbox */
            .checkbox-label {
                font-size: 13px; color: var(--text-main); cursor: pointer; display: flex;
                align-items: center; gap: 8px; user-select: none;
            }
            .checkbox-label input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

            /* Buttons */
            .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
            button, input[type="button"] {
                border: none;
                padding: 0 20px;
                height: 42px;
                font-size: 14px;
                border-radius: var(--radius-sm);
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-family: var(--font-sans);
            }
            button:active, input[type="button"]:active { transform: translateY(1px); }
            button:disabled, input[type="button"]:disabled { cursor: not-allowed; opacity: 0.6; transform: none; box-shadow: none !important; }

            .btn-primary {
                background-color: var(--accent);
                color: white;
                flex: 1;
                box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            }
            .btn-primary:hover:not(:disabled) {
                background-color: var(--accent-hover);
                box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3);
            }

            .btn-default {
                background-color: white;
                border: 1px solid var(--border-color) !important;
                color: var(--text-main);
                box-shadow: var(--shadow-sm);
            }
            .btn-default:hover:not(:disabled) { background-color: var(--bg-body); border-color: #cbd5e1; }

            .btn-outline-accent {
                border: 1px solid var(--accent) !important;
                color: var(--accent);
                background: #fff;
                flex: 1;
            }
            .btn-outline-accent:hover:not(:disabled) { background: #eff6ff; }

            .btn-danger {
                background-color: var(--danger);
                color: white;
                flex: 1;
                border: none !important;
            }
            .btn-danger:hover:not(:disabled) { background-color: var(--danger-hover); }

            .btn-warning {
                background-color: var(--warning);
                color: white;
            }
            .btn-warning:hover:not(:disabled) { background-color: #d97706; }

            .btn-sm {
                height: 34px;
                padding: 0 14px;
                font-size: 13px;
            }

            .btn-icon {
                width: 42px;
                padding: 0;
                flex: none;
            }

            /* Chip info */
            .chip-info {
                background: #f0fdf4;
                border: 1px solid #bbf7d0;
                color: #166534;
                padding: 10px 14px;
                border-radius: var(--radius-sm);
                font-size: 13px;
                font-weight: 600;
            }

            /* File table */
            .file-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            .file-table thead th {
                text-align: left;
                padding: 10px 12px;
                border-bottom: 2px solid var(--border-color);
                font-weight: 600;
                color: var(--text-muted);
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
            .file-table tbody td {
                padding: 10px 12px;
                border-bottom: 1px solid var(--border-color);
                vertical-align: middle;
            }
            .file-table tbody tr:last-child td { border-bottom: none; }
            .file-table input[type="text"] { height: 36px; font-size: 13px; }
            .file-table input[type="file"] { height: 36px; font-size: 12px; }
            .file-table input[type="button"] { height: 32px; font-size: 12px; padding: 0 10px; }
            .file-table progress {
                width: 100%;
                height: 6px;
                border-radius: 999px;
                overflow: hidden;
            }
            .file-table progress::-webkit-progress-bar { background: #e2e8f0; border-radius: 999px; }
            .file-table progress::-webkit-progress-value { background: var(--success); border-radius: 999px; }

            /* Right column */
            .right-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
            .terminal-wrapper {
                background-color: #020617;
                border-radius: var(--radius-lg);
                border: 1px solid #1e293b;
                overflow: hidden;
                box-shadow: var(--shadow-md);
                display: flex;
                flex-direction: column;
                flex: 1;
            }
            .terminal-header {
                background-color: #0f172a;
                padding: 12px 16px;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-shrink: 0;
                border-bottom: 1px solid #1e293b;
            }
            .terminal-header .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                border: 1px solid rgba(0,0,0,0.1);
            }
            .terminal-title {
                margin-left: auto;
                margin-right: auto;
                color: #64748b;
                font-size: 12px;
                font-family: var(--font-sans);
                font-weight: 500;
            }
            #terminal {
                flex: 1;
                padding: 12px 16px;
                overflow: hidden;
            }
            /* xterm overrides */
            #terminal .xterm { padding: 8px; }
            #terminal .xterm-viewport::-webkit-scrollbar { width: 10px; }
            #terminal .xterm-viewport::-webkit-scrollbar-track { background: #020617; }
            #terminal .xterm-viewport::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; border: 2px solid #020617; }
            #terminal .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #475569; }

            /* Footer */
            footer {
                background-color: var(--bg-card);
                border-top: 1px solid var(--border-color);
                padding: 12px 32px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 13px;
                color: var(--text-muted);
                flex-shrink: 0;
                z-index: 10;
            }
            .footer-links {
                display: flex;
                gap: 16px;
                align-items: center;
            }

            /* Divider */
            .divider {
                border: none;
                border-top: 1px solid var(--border-color);
                margin: 4px 0;
            }

            /* Hidden state */
            .hidden { display: none !important; }

            /* Inline label + control */
            .inline-row {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .inline-row label {
                font-size: 13px;
                font-weight: 600;
                color: var(--primary);
                white-space: nowrap;
            }
            .inline-row select { flex: 1; }

            /* Responsive */
            @media (max-width: 1024px) {
                main { flex-direction: column; overflow-y: auto; }
                .left-col { width: 100%; overflow-y: visible; }
                .right-col { min-height: 400px; }
            }
        </style>
    </head>
    <body>
        <!-- Safari warning -->
        <div id="safariErr" class="safari-alert hidden">
            <p data-i18n="page.safariErr">此工具不支持 Safari 浏览器！</p>
        </div>

        <header>
            <h1 class="brand">
                <img src="./favicon.svg" width="24" height="24" crossorigin />
                <span data-i18n="page.title">固件串口烧录工具</span>
                <span class="badge" id="badge">源自 <a href="https://github.com/espressif/esptool-js" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">esptool-js</a></span>
            </h1>
            <div class="header-right">
                <label class="checkbox-label">
                    <input type="checkbox" id="debugLogging" />
                    <span data-i18n="page.debugLog">显示调试日志</span>
                </label>
                <div class="lang-dropdown" id="langDropdown">
                    <button class="lang-btn" id="langSwitch" type="button" title="Language">
                        <img src="./language.svg" width="20" height="20" alt="lang" />
                    </button>
                    <div class="lang-menu" id="langMenu">
                        <div class="lang-option" data-lang="zh">中文</div>
                        <div class="lang-option" data-lang="en">English</div>
                    </div>
                </div>
            </div>
        </header>

        <main id="main">
            <!-- Left: Control Panels -->
            <section class="left-col" aria-label="控制面板">

                <!-- Program Panel -->
                <div class="panel" id="program">
                    <h2 class="panel-title">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        <span data-i18n="program.title">烧录</span>
                    </h2>

                    <div class="input-group" id="baudrateGroup">
                        <label for="baudrates" id="lblBaudrate" data-i18n="program.baudrate">波特率</label>
                        <select id="baudrates">
                            <option value="921600">921600</option>
                            <option value="460800">460800</option>
                            <option value="230400">230400</option>
                            <option value="115200">115200</option>
                        </select>
                    </div>
                    <label class="hidden chip-info" id="lblConnTo" data-i18n="program.connected">已连接设备：</label>

                    <div class="btn-group">
                        <button class="btn-primary" type="button" id="connectButton" data-i18n-value="program.connect">连接</button>
                        <button class="btn-outline-accent" type="button" id="copyTraceButton" data-i18n-value="program.copyTrace">复制日志</button>
                    </div>
                    <div class="btn-group hidden" id="disconnectGroup">
                        <button class="btn-warning" type="button" id="disconnectButton" data-i18n-value="program.disconnect">断开连接</button>
                        <button class="btn-danger" type="button" id="eraseButton" data-i18n-value="program.eraseFlash">擦除 Flash</button>
                    </div>

                    <div class="alert-danger hidden" id="alertDiv">
                        <button class="close-btn" aria-label="close" onclick="document.getElementById('alertDiv').classList.add('hidden')">&times;</button>
                        <span id="alertmsg"></span>
                    </div>

                    <!-- Files section (shown after connect) -->
                    <div id="files" class="hidden">
                        <table class="file-table" id="fileTable">
                            <thead>
                                <tr>
                                    <th data-i18n="table.flashAddr">Flash 地址</th>
                                    <th data-i18n="table.file">文件</th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                        <div style="margin-top: 12px;">
                            <button class="btn-default btn-sm" type="button" id="addFile" data-i18n-value="table.addFile">添加文件</button>
                        </div>
                    </div>

                    <div class="hidden" id="flashSettings">
                        <div class="grid-3-col">
                            <div class="input-group">
                                <label for="flashMode" id="lblFlashMode" data-i18n="flash.mode">Flash 模式</label>
                                <select id="flashMode">
                                    <option value="keep" selected data-i18n="flash.keep">保持不变</option>
                                    <option value="dio">dio</option>
                                    <option value="qio">qio</option>
                                    <option value="dout">dout</option>
                                    <option value="qout">qout</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="flashFreq" id="lblFlashFreq" data-i18n="flash.freq">Flash 频率</label>
                                <select id="flashFreq">
                                    <option value="keep" data-i18n="flash.keep">保持不变</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="flashSize" id="lblFlashSize" data-i18n="flash.size">Flash 大小</label>
                                <select id="flashSize">
                                    <option value="detect" data-i18n="flash.detect">自动检测</option>
                                    <option value="keep" data-i18n="flash.keep">保持不变</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="hidden" id="programBtnWrap">
                        <button class="btn-primary" type="button" id="programButton" data-i18n-value="flash.program" style="width:100%">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            烧录
                        </button>
                    </div>

                </div>

                <!-- Console Panel -->
                <div class="panel" id="console">
                    <h2 class="panel-title">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        <span data-i18n="console.title">控制台</span>
                    </h2>

                    <label class="hidden chip-info" id="lblConsoleFor" data-i18n="console.connected">已连接设备：</label>

                    <div class="grid-3-col">
                        <div class="input-group" id="consoleBaudGroup">
                            <label for="consoleBaudrates" id="lblConsoleBaudrate" data-i18n="console.baudrate">波特率</label>
                            <select id="consoleBaudrates">
                                <option value="115200">115200</option>
                                <option value="74880">74880</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="reconnectDelay" id="lblReconnectDelay" data-i18n="console.reconnectDelay">重连延迟(ms)</label>
                            <input type="number" id="reconnectDelay" value="1000" min="100" max="10000" step="100" />
                        </div>
                        <div class="input-group">
                            <label for="maxRetries" id="lblMaxRetries" data-i18n="console.maxRetries">最大重试次数</label>
                            <input type="number" id="maxRetries" value="5" min="1" max="20" step="1" />
                        </div>
                    </div>

                    <div class="btn-group">
                        <button class="btn-primary" type="button" id="consoleStartButton" data-i18n-value="console.start">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            开始
                        </button>
                        <button class="btn-danger" type="button" id="consoleStopButton" data-i18n-value="console.stop">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="6" y="6" width="12" height="12"/></svg>
                            停止
                        </button>
                        <button class="btn-default" type="button" id="resetButton" data-i18n-value="console.reset">重置</button>
                    </div>
                </div>
            </section>

            <!-- Right: Terminal -->
            <section class="right-col" aria-label="终端输出区">
                <div class="terminal-wrapper">
                    <div class="terminal-header">
                        <div class="dot" style="background: #ef4444; border-color: #dc2626;"></div>
                        <div class="dot" style="background: #f59e0b; border-color: #d97706;"></div>
